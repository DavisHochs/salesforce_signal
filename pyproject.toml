[project]
name = "salesforce-signal"
version = "0.0.1"
description = "Signal to Send: real-time cart-recovery journey with a decision-model triage layer and Salesforce automation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generator*", "triage*", "eval*", "bridge*", "dashboard*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in docs are design sketches, not source; don't lint or format them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: hits a live service (AUTO-LIVE); never runs in CI",
]
